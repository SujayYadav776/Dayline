name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

  package:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build Dayline.exe (PyInstaller onedir)
        run: uv run pyinstaller packaging/dayline.spec --noconfirm
      - name: Frozen-build smoke test (--selftest)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "$PWD\dist\Dayline\Dayline.exe" `
               -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed with exit code $p.ExitCode"; exit 1 }
      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $ver = (uv run python scripts/print_version.py).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$ver" "/DDistDir=$PWD\dist\Dayline" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: app-dir
          path: dist/Dayline/
          compression-level: 9

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer
      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
