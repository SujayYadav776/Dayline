[project]
name = "dayline"
version = "0.0.1"
description = "Dayline — a Windows to-do app that uses an Obsidian vault as its database."
requires-python = "==3.12.*"
authors = [{ name = "Sujay Yadav" }]
dependencies = [
    "PySide6==6.9.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "hypothesis>=6.112",
    "coverage[toml]>=7.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller==6.22.3",
    "pillow>=10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dayline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.coverage.run]
source = ["src/dayline"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# Obsidian Tasks tokens ARE emoji; unicode-lookalike warnings are noise here
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"packaging/*.spec" = ["ALL"]

[tool.mypy]
python_version = "3.12"
files = ["src/dayline", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "dayline.core.*"
strict = true
